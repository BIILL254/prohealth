<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>Customer: Log in and Register</title><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F9FAFB"/><rect x="0" y="0" width="640" height="900" rx="0" fill="#0F766E"/><rect x="64" y="56" width="34" height="34" rx="9" fill="#0F766E"/><rect x="78" y="63" width="6" height="20" rx="2" fill="#fff"/><rect x="71" y="70" width="20" height="6" rx="2" fill="#fff"/><text x="108" y="80" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">ProHealth</text><text x="64" y="330" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#fff" text-anchor="start">Your pharmacy,</text><text x="64" y="384" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#fff" text-anchor="start">delivered.</text><text x="64" y="430" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#CCFBF1" text-anchor="start">Order medicines online, upload prescriptions</text><text x="64" y="458" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#CCFBF1" text-anchor="start">and pay securely with M-Pesa.</text><circle cx="76" cy="540" r="10" fill="#14B8A6"/><text x="100" y="546" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start">Genuine, pharmacist-verified medicines</text><circle cx="76" cy="582" r="10" fill="#14B8A6"/><text x="100" y="588" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start">Pay with M-Pesa in seconds</text><circle cx="76" cy="624" r="10" fill="#14B8A6"/><text x="100" y="630" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start">Delivery or in-store pickup</text><rect x="800" y="160" width="440" height="580" rx="16" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><rect x="824" y="184" width="196" height="44" rx="10" fill="#E6F4F1"/><text x="922" y="212" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F766E" text-anchor="middle">Log in</text><text x="1122" y="212" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle">Register</text><text x="824" y="270" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151" text-anchor="start">Email address</text><rect x="824" y="278" width="392" height="44" rx="8" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="838" y="305.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">you@example.com</text><text x="824" y="352" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151" text-anchor="start">Password</text><rect x="824" y="360" width="392" height="44" rx="8" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="838" y="387.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#9CA3AF" text-anchor="start">••••••••</text><text x="1216" y="440" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F766E" text-anchor="end">Forgot password?</text><rect x="824" y="470" width="392" height="48" rx="8" fill="#0F766E"/><text x="1020.0" y="499.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Log in</text><line x1="824" y1="560" x2="1000" y2="560" stroke="#E5E7EB" stroke-width="1"/><text x="1020" y="565" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">or</text><line x1="1050" y1="560" x2="1216" y2="560" stroke="#E5E7EB" stroke-width="1"/><text x="1020" y="610" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#4B5563" text-anchor="middle">New here?  Create a free account</text><rect x="824" y="640" width="392" height="48" rx="8" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="1020.0" y="669.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Create account</text><text x="1020" y="715" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">Registration asks for: full name, email, phone (M-Pesa), password</text></svg>